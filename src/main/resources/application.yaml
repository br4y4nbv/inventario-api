spring:
  application:
    name: inventario-api
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  jwt:
    # Clave de firma HS256 (mínimo 32 caracteres). Llega por variable de entorno
    secret: ${JWT_SECRET:}
    expiracion-minutos: 60
  admin:
    # Administrador inicial: solo se crea si ambas variables están definidas
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

springdoc:
  # DOCS_ENABLED=false apaga Swagger y /v3/api-docs
  api-docs:
    enabled: ${DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${DOCS_ENABLED:true}
    operations-sorter: method
    tags-sorter: alpha