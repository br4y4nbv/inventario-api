services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-inventario}
      POSTGRES_USER: ${DB_USER:-inventario}
      # El signo ":?" hace que compose se detenga con ese mensaje si la variable falta
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
    volumes:
      - pgdata:/var/lib/postgresql/data      # los datos sobreviven a reinicios
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-inventario} -d ${DB_NAME:-inventario}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No se publica el puerto 5432: la base de datos solo es accesible desde la API

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy           # la API espera a que PostgreSQL esté realmente listo
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-inventario}   # "db" es el nombre del servicio
      DB_USER: ${DB_USER:-inventario}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el archivo .env (mínimo 32 caracteres)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"

volumes:
  pgdata: